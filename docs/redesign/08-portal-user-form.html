<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DCR Pay — Create User</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--sidebar:#1A2430;--sidebar-hover:#22303F;--sidebar-text:rgba(255,255,255,.72);--sidebar-muted:rgba(255,255,255,.38);--brand:#BE222F;--brand-hover:#A31E29;--bg:#F8FAFC;--surface:#FFFFFF;--text:#0F172A;--text-muted:#64748B;--text-light:#94A3B8;--border:#E2E8F0;--sidebar-w:240px;--topbar-h:64px;--radius:8px;--radius-lg:12px}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}

    .sidebar{width:var(--sidebar-w);background:var(--sidebar);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:40;border-right:1px solid rgba(255,255,255,.06)}
    .sidebar-logo{padding:0 20px;height:var(--topbar-h);display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0}
    .logo-mark{width:32px;height:32px;background:var(--brand);border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .logo-name{font-size:15px;font-weight:700;color:#fff;letter-spacing:-.01em}.logo-sub{font-size:10px;color:var(--sidebar-muted);letter-spacing:.07em;text-transform:uppercase;margin-top:1px}
    .sidebar-nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
    .nav-section-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--sidebar-muted);padding:12px 10px 6px}
    .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;color:var(--sidebar-text);font-size:13.5px;font-weight:500;text-decoration:none;cursor:pointer;transition:background 160ms,color 160ms}
    .nav-item:hover{background:var(--sidebar-hover);color:#fff}.nav-item.active{background:var(--brand);color:#fff}
    .nav-item svg{flex-shrink:0;opacity:.8}.nav-item.active svg{opacity:1}
    .sidebar-footer{border-top:1px solid rgba(255,255,255,.07);padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:background 160ms}
    .sidebar-footer:hover{background:rgba(255,255,255,.05)}
    .avatar{width:32px;height:32px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
    .user-name{font-size:13px;font-weight:600;color:#fff}.user-role{font-size:11px;color:var(--sidebar-muted)}
    .sidebar-footer-right{margin-left:auto;color:var(--sidebar-muted)}

    .main-wrap{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh}
    .topbar{height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;position:sticky;top:0;z-index:30;gap:12px}
    .topbar-title{font-size:15px;font-weight:600;color:var(--text);flex:1}
    .topbar-right{display:flex;align-items:center;gap:12px}
    .topbar-icon-btn{width:36px;height:36px;border-radius:6px;border:1px solid var(--border);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);transition:background 160ms}
    .topbar-icon-btn:hover{background:var(--bg)}
    .topbar-avatar{width:32px;height:32px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;cursor:pointer}
    .content{flex:1;padding:28px;display:flex;justify-content:center}

    .form-container{width:100%;max-width:640px}
    .form-header{margin-bottom:24px}
    .back-link{display:inline-flex;align-items:center;gap:5px;color:var(--text-muted);font-size:13px;text-decoration:none;margin-bottom:12px;transition:color 160ms}
    .back-link:hover{color:var(--text)}
    .form-title{font-size:18px;font-weight:700;color:var(--text);letter-spacing:-.02em}
    .form-sub{font-size:13px;color:var(--text-muted);margin-top:3px}

    .form-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:16px}
    .form-card-header{padding:16px 20px;border-bottom:1px solid var(--border);background:var(--bg)}
    .form-card-title{font-size:13px;font-weight:700;color:var(--text);letter-spacing:-.01em}
    .form-card-body{padding:20px}

    .field-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .field-full{grid-column:1/-1}
    .field-group{display:flex;flex-direction:column;gap:5px}
    .field-label{font-size:13px;font-weight:500;color:var(--text)}
    .required-dot{color:var(--brand);margin-left:2px}
    .field-input,.field-select{padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);font:400 14px 'Inter',sans-serif;color:var(--text);background:var(--surface);outline:none;transition:border-color 160ms,box-shadow 160ms;width:100%}
    .field-input::placeholder{color:var(--text-light)}
    .field-input:focus,.field-select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(190,34,47,.1)}
    .field-select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%2364748B' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;padding-right:36px}
    .password-wrap{position:relative}
    .password-wrap .field-input{padding-right:40px}
    .show-pwd-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-light);padding:4px;display:flex;align-items:center;transition:color 160ms}
    .show-pwd-btn:hover{color:var(--text-muted)}
    .field-hint{font-size:12px;color:var(--text-light)}

    .form-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding-top:8px}
    .btn-cancel{padding:9px 18px;border-radius:var(--radius);border:1px solid var(--border);background:transparent;font:500 13.5px 'Inter',sans-serif;color:var(--text-muted);cursor:pointer;transition:background 160ms,color 160ms}
    .btn-cancel:hover{background:var(--bg);color:var(--text)}
    .btn-create{padding:9px 20px;border-radius:var(--radius);background:var(--brand);color:#fff;font:600 13.5px 'Inter',sans-serif;border:none;cursor:pointer;transition:background 180ms}
    .btn-create:hover{background:var(--brand-hover)}

    @media(max-width:640px){.main-wrap{margin-left:0}.sidebar{display:none}.field-grid-2{grid-template-columns:1fr}}
  </style>
</head>
<body>

<aside class="sidebar" role="navigation" aria-label="Main navigation">
  <div class="sidebar-logo">
    <div class="logo-mark" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 18 18" fill="none"><rect x="2" y="5" width="14" height="10" rx="2" stroke="white" stroke-width="1.5"/><path d="M2 8h14" stroke="white" stroke-width="1.5"/><circle cx="5.5" cy="11.5" r="1" fill="white"/></svg></div>
    <div><div class="logo-name">DCR Pay</div><div class="logo-sub">Operations</div></div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section-label">Main</div>
    <a href="#" class="nav-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
    <a href="#" class="nav-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>Applications</a>
    <div class="nav-section-label">Management</div>
    <a href="#" class="nav-item active" aria-current="page"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>Users</a>
  </nav>
  <div class="sidebar-footer" role="button" tabindex="0">
    <div class="avatar" aria-hidden="true">JD</div>
    <div><div class="user-name">John Doe</div><div class="user-role">Administrator</div></div>
    <div class="sidebar-footer-right" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="4" r="1" fill="currentColor"/><circle cx="8" cy="8" r="1" fill="currentColor"/><circle cx="8" cy="12" r="1" fill="currentColor"/></svg></div>
  </div>
</aside>

<div class="main-wrap">
  <header class="topbar" role="banner">
    <span class="topbar-title">Create User</span>
    <div class="topbar-right">
      <button class="topbar-icon-btn" aria-label="Notifications"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg></button>
      <div class="topbar-avatar" role="button" tabindex="0">JD</div>
    </div>
  </header>

  <main class="content" role="main">
    <div class="form-container">
      <div class="form-header">
        <a href="#" class="back-link">
          <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 3L5 7l4 4"/></svg>
          Back to Users
        </a>
        <h1 class="form-title">Create New User</h1>
        <p class="form-sub">Add a team member with role-based access to this portal</p>
      </div>

      <form novalidate aria-label="Create user form">

        <!-- Personal Information -->
        <div class="form-card">
          <div class="form-card-header">
            <div class="form-card-title">Personal Information</div>
          </div>
          <div class="form-card-body">
            <div class="field-grid-2">
              <div class="field-group">
                <label class="field-label" for="first-name">First Name<span class="required-dot" aria-hidden="true">*</span></label>
                <input class="field-input" type="text" id="first-name" name="firstName" placeholder="John" required autocomplete="given-name">
              </div>
              <div class="field-group">
                <label class="field-label" for="last-name">Last Name<span class="required-dot" aria-hidden="true">*</span></label>
                <input class="field-input" type="text" id="last-name" name="lastName" placeholder="Doe" required autocomplete="family-name">
              </div>
              <div class="field-group">
                <label class="field-label" for="email">Email Address<span class="required-dot" aria-hidden="true">*</span></label>
                <input class="field-input" type="email" id="email" name="email" placeholder="john.doe@company.com" required autocomplete="email">
              </div>
              <div class="field-group">
                <label class="field-label" for="phone">Phone Number</label>
                <input class="field-input" type="tel" id="phone" name="phone" placeholder="+84 90 000 000" autocomplete="tel">
              </div>
            </div>
          </div>
        </div>

        <!-- Access -->
        <div class="form-card">
          <div class="form-card-header">
            <div class="form-card-title">Access &amp; Credentials</div>
          </div>
          <div class="form-card-body">
            <div class="field-grid-2">
              <div class="field-group field-full">
                <label class="field-label" for="role">Role<span class="required-dot" aria-hidden="true">*</span></label>
                <select class="field-select" id="role" name="role" required>
                  <option value="">Select a role…</option>
                  <option value="admin">Administrator — Full access</option>
                  <option value="staff">Staff — Applications &amp; reporting</option>
                  <option value="viewer">Viewer — Read-only access</option>
                </select>
              </div>
              <div class="field-group">
                <label class="field-label" for="password">Password<span class="required-dot" aria-hidden="true">*</span></label>
                <div class="password-wrap">
                  <input class="field-input" type="password" id="password" name="password" placeholder="Min. 8 characters" required autocomplete="new-password">
                  <button type="button" class="show-pwd-btn" aria-label="Toggle password visibility">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  </button>
                </div>
              </div>
              <div class="field-group">
                <label class="field-label" for="confirm-password">Confirm Password<span class="required-dot" aria-hidden="true">*</span></label>
                <div class="password-wrap">
                  <input class="field-input" type="password" id="confirm-password" name="confirmPassword" placeholder="Re-enter password" required autocomplete="new-password">
                  <button type="button" class="show-pwd-btn" aria-label="Toggle confirm password visibility">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn-cancel">Cancel</button>
          <button type="submit" class="btn-create">
            <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-right:4px"><path d="M2 7l3.5 3.5L12 3"/></svg>
            Create User
          </button>
        </div>

      </form>
    </div>
  </main>
</div>
</body>
</html>
